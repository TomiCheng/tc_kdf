[package]
name = "tc_pbe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Password-based key derivation for PBE after Bouncy Castle: PBKDF1, PBKDF2, PKCS#12 and OpenSSL's EVP_BytesToKey."
readme = "README.md"
documentation = "https://docs.rs/tc_pbe"
keywords = ["pbkdf2", "pbe", "password", "pkcs12", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
tc_digest = "0.1.0"
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
tc_md = "0.1.1"
tc_sha = "0.1.1"
